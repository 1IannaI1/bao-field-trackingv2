async function osrmMatchChunk(wps){

const url=OSRM_BASE+coords+"?overview=full&geometries=geojson&radiuses="+radiuses+"&gaps=split&tidy=true";
const res=await fetch(url,{signal: AbortSignal.timeout(12000)});
if(!res.ok)throw new Error("OSRM HTTP "+res.status);

for(const matching of json.matchings){
const coords=matching.geometry.coordinates;
for(const c of coords)pts.push([c[1],c[0]]);

function pageList(total,cur){
if(total<=7)return Array.from({length:total},(_,i)=>i+1);
const want=[1,total,cur-1,cur,cur+1];
if(cur<=3)want.push(2,3,4);
if(cur>=total-2)want.push(total-1,total-2,total-3);
const arr=[...new Set(want)].filter(p=>p>=1&&p<=total).sort((a,b)=>a-b);
const out=[];let prev=0;
for(const p of arr){if(p-prev>1)out.push("…");out.push(p);prev=p;}
return out;}

function AgentDash({user,onLogout}){
